name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Add the Wasm target
        run: rustup target add wasm32v1-none

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints (v1 and v2)
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features v2 -- -D warnings

      - name: Tests (v1 and v2)
        run: |
          cargo test --locked
          cargo test --locked --features v2

      - name: Build both Wasm variants and check they differ
        run: |
          cargo build --locked --release --target wasm32v1-none -p wasmward-fixture
          cp target/wasm32v1-none/release/wasmward_fixture.wasm v1.wasm
          cargo build --locked --release --target wasm32v1-none -p wasmward-fixture --features v2
          cp target/wasm32v1-none/release/wasmward_fixture.wasm v2.wasm
          v1="$(sha256sum v1.wasm | cut -d' ' -f1)"
          v2="$(sha256sum v2.wasm | cut -d' ' -f1)"
          echo "v1 $v1"
          echo "v2 $v2"
          # The whole point of the fixture is that the two builds have different hashes.
          if [ "$v1" = "$v2" ]; then
            echo "v1 and v2 have the same hash; the v2 feature had no effect" >&2
            exit 1
          fi
          sha256sum v1.wasm v2.wasm > hashes.txt
          {
            echo "### Wasm hashes of this CI build"
            echo
            echo "| build | sha256 |"
            echo "|---|---|"
            echo "| v1 | \`$v1\` |"
            echo "| v2 | \`$v2\` |"
            echo
            echo "These are the hashes CI produced. They will not match the deployed fixture's (see \`fixture.wasmward.json\`): the same source gives a different Wasm under the Stellar CLI, a plain cargo build and CI, so the hash that counts is the one of the artifact that was uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

  # The lifetime check script has no dependencies and talks to the network only when run for real, so its
  # logic (the ledger key, the day arithmetic, what counts as expired) is tested offline here.
  scripts:
    name: scripts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The scripts claim to need only Node 18 or newer, so run them on the oldest and the newest.
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # deploy.sh and extend.sh only run against the real network, so CI never executes them; at least make
      # sure they still parse.
      - name: Check the scripts parse
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.mjs; do node --check "$script"; done
      - name: Test the scripts
        run: node --test scripts/*.test.mjs

name: Fixture health

# The test contract on Stellar testnet expires after about a week unless it is extended, and an expired
# fixture breaks the Wasmward README example, the browser demo and the integration tests. This uses Wasmward
# itself to check, every week, that the fixture still exists, still runs a supported build, and has at least
# MIN_DAYS left, and (scripts/fixture-status.mjs) that the Wasm code of every supported build, including
# the v2 build the upgrade tests move to, also has at least MIN_DAYS left. A red run means: run
# scripts/extend.sh (it restores what has expired too), or scripts/deploy.sh if it has gone.
#
# MIN_DAYS is 14 because the check runs once a week: with a warning window of two weeks, at least two runs go red
# before anything expires, and an extension (about 29 days) leaves a fortnight of green. The first deployment
# expired on a threshold of 3 days, which one weekly run can miss entirely.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIN_DAYS: '14'
    steps:
      - uses: actions/checkout@v7

      # The Wasmward action builds Wasmward and runs `wasmward check`. This is the whole job.
      - name: Check the fixture (at least MIN_DAYS of life left)
        uses: contract-version/Wasmward-backend@main
        with:
          config: fixture.wasmward.json
          min-ttl-days: ${{ env.MIN_DAYS }}

      # Wasmward only sees the build that is live, and a supported one is all it asks for. This also reads the Wasm code
      # of every supported build (the upgrade tests need v2's to exist) and wants the fixture on v1: the demo and the
      # README example expect it, and an interrupted upgrade test can leave it on v2, which Wasmward alone calls fine.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The frontend and the backend pin this contract (its ID and v1 hash, and the backend's recorded answers). A redeploy
      # that did not reach them leaves the demo watching a contract that is gone, and nothing else would notice.
      - name: Check out the frontend, which pins this fixture
        uses: actions/checkout@v7
        with:
          repository: contract-version/Wasmward-frontend
          path: siblings/Wasmward-frontend
      - name: Check out the backend, which pins this fixture
        uses: actions/checkout@v7
        with:
          repository: contract-version/Wasmward-backend
          path: siblings/Wasmward-backend
      - name: Check that both pin this contract
        run: node scripts/sync-siblings.mjs --check --frontend siblings/Wasmward-frontend --backend siblings/Wasmward-backend

      - name: Check the builds, the lifetimes and that the fixture runs v1
        run: |
          status=0
          node scripts/fixture-status.mjs --config fixture.wasmward.json --min-days "$MIN_DAYS" --expect v1 > status.txt || status=$?
          cat status.txt
          {
            echo '### The fixture'
            echo
            echo '```text'
            cat status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: What to do
        if: failure()
        run: |
          echo "The testnet fixture (or the Wasm code of one of its builds) is missing, unsupported, unreachable or about to expire." >&2
          echo "What to do, case by case: docs/RECOVERY.md" >&2
          echo "Extend it:    bash scripts/extend.sh" >&2
          echo "Or redeploy:  bash scripts/deploy.sh   (then update fixture.wasmward.json and the hashes in the Wasmward repositories)" >&2

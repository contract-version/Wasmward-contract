name: Fixture health

# The test contract on Stellar testnet expires after about a week unless it is extended, and an expired
# fixture breaks the Wasmward README example, the browser demo and the integration tests. This uses Wasmward
# itself to check, every week, that the fixture still exists, still runs a supported build, and has at least
# three days left, and (scripts/check-lifetimes.mjs) that the Wasm code of every supported build, including
# the v2 build the upgrade tests move to, also has at least three days left. A red run means: run
# scripts/extend.sh (or scripts/deploy.sh if it has gone).
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The Wasmward action builds Wasmward and runs `wasmward check`. This is the whole job.
      - name: Check the fixture (at least 3 days of life left)
        uses: contract-version/Wasmward-backend@main
        with:
          config: fixture.wasmward.json
          min-ttl-days: '3'

      # Wasmward only sees the build that is live. The upgrade tests need v2's code entry to exist as well.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Wasm code of every supported build (at least 3 days of life left)
        run: node scripts/check-lifetimes.mjs --config fixture.wasmward.json --min-days 3

      # The demo and the README example expect v1. The upgrade tests move the fixture to v2 and back, so an
      # interrupted run can leave it on v2, which Wasmward alone calls fine because v2 is also supported.
      - name: Check the fixture runs v1
        run: node scripts/live-build.mjs --config fixture.wasmward.json --expect v1

      - name: What to do
        if: failure()
        run: |
          echo "The testnet fixture (or the Wasm code of one of its builds) is missing, unsupported, unreachable or about to expire." >&2
          echo "Extend it:    bash scripts/extend.sh" >&2
          echo "Or redeploy:  bash scripts/deploy.sh   (then update fixture.wasmward.json and the hashes in the Wasmward repositories)" >&2
